version: 2

models:
  - name: stg_frankfurter__rates
    description: >
      Daily ECB FX rates, business days only (no weekends/holidays).
      1 base_currency = fx_rate x quote_currency. Use int_fx_rates__daily for calendar-day joins.
    data_tests:
      # Bronze is written with MERGE on this key -> test instead of deduplicating
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [rate_date, base_currency, quote_currency]
    columns:
      - name: rate_date
        description: ECB business day the rate was published for.
        data_tests:
          - not_null
      - name: base_currency
        description: Currency being converted (BRL).
        data_tests:
          - not_null
      - name: quote_currency
        description: Target currency (EUR, CZK, USD).
        data_tests:
          - not_null
      - name: fx_rate
        description: Exchange rate, 1 base = fx_rate x quote.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false