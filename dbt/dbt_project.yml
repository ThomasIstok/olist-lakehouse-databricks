# dbt project: bronze -> silver (staging/intermediate) -> gold -> report-level marts
name: olist_lakehouse
version: "1.0.0"
config-version: 2
profile: olist_lakehouse   # must match the name in ~/.dbt/profiles.yml

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
clean-targets: ["target", "dbt_packages"]

# Business parameters in one place (used by gold models)
vars:
  analysis_start_date: "2017-01-01"   # before: platform ramp-up, very few orders
  analysis_end_date: "2018-08-31"     # after: incomplete export months

# Where models land: folder -> schema + materialization
models:
  olist_lakehouse:
    staging:              # 1:1 cleaned copies of bronze tables
      +schema: silver
      +materialized: view # cheap: no data copy, always reflects bronze
    intermediate:         # joins / enrichment reused by several gold models
      +schema: silver
      +materialized: view
    gold:                 # single source of truth, queried a lot -> store as tables
      +schema: gold
      +materialized: table
    marts:                # report-level marts: only SELECT / WHERE (+ aggregation in facts) on gold
      sales_overview:
        +schema: mart_sales_overview
        +materialized: view   # no data copy - gold stays the only place where data lives

# Manually maintained reference data (CSV files in dbt/seeds)
seeds:
  olist_lakehouse:
    +schema: silver