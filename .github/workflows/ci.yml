# CI = automatic checks on every pull request into main.
# Runs on a clean GitHub machine, so everything it needs is installed here.
# No Databricks access needed: ruff, pytest and dbt parse only read the code.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch: # allows a manual run from the Actions tab

# Least privilege: the workflow only needs to read the repo
permissions:
  contents: read

# A new push to the same PR cancels the older, now outdated run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      # 1) Get the code of the pull request
      - name: Checkout
        uses: actions/checkout@v4

      # 2) Same Python as locally and in the Job (3.12).
      #    cache: pip keeps downloaded packages between runs (pyspark alone is ~400 MB).
      #    cache-dependency-path: rebuild the cache when ANY requirements file changes,
      #    not only requirements.txt (the default).
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      # 3) Same tool versions as locally (pinned in requirements files)
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # 4) Python lint: bugs and bad practices in src/ and tests/
      - name: Ruff
        run: ruff check src tests

      # 5) Unit tests for src/ (settings in pytest.ini).
      #    No Spark session and no network: HTTP calls and sleeps are mocked.
      - name: Pytest
        run: pytest

      # 6) dbt needs a profile even to parse. parse never connects to Databricks,
      #    so dummy values are enough and no real secret is stored anywhere.
      #    Written here (not committed), because profiles.yml is git-ignored on purpose.
      - name: Create dbt CI profile
        run: |
          mkdir -p "$RUNNER_TEMP/dbt_profiles"
          cat > "$RUNNER_TEMP/dbt_profiles/profiles.yml" <<'EOF'
          olist_lakehouse:
            target: ci
            outputs:
              ci:
                type: databricks
                host: ci-dummy.cloud.databricks.com
                http_path: /sql/1.0/warehouses/ci-dummy
                token: ci-dummy-not-a-secret
                catalog: olist_dev
                schema: silver
                threads: 1
          EOF

      # 7) Install dbt packages (dbt_utils); dbt_packages/ is git-ignored
      - name: dbt deps
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: ${{ runner.temp }}/dbt_profiles
        run: dbt deps

      # 8) Validate the whole project; any warning (e.g. YAML not matching a model) fails CI
      - name: dbt parse (warnings as errors)
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: ${{ runner.temp }}/dbt_profiles
        run: dbt parse --no-partial-parse --warn-error