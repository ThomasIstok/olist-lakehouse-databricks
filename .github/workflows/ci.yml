# CI = automatic checks on every pull request into main.
#
# Job "checks": quick checks on a clean GitHub machine, no Databricks access:
#   ruff, pytest and dbt parse only read the code.
# Job "dbt_build_pr": builds the whole dbt project in Databricks (catalog olist_dev)
#   into schemas of its own (ci_pr<PR>_run<run>_*), runs all dbt tests,
#   then always drops those schemas again.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch: # allows a manual run from the Actions tab

# Least privilege: the workflow only needs to read the repo
permissions:
  contents: read

# A new push to the same PR cancels the older, now outdated run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      # 1) Get the code of the pull request
      - name: Checkout
        uses: actions/checkout@v4

      # 2) Same Python as locally and in the Job (3.12).
      #    cache: pip keeps downloaded packages between runs (pyspark alone is ~400 MB).
      #    cache-dependency-path: rebuild the cache when ANY requirements file changes,
      #    not only requirements.txt (the default).
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      # 3) Same tool versions as locally (pinned in requirements files)
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # 4) Python lint: bugs and bad practices in src/ and tests/
      - name: Ruff
        run: ruff check src tests

      # 5) Unit tests for src/ (settings in pytest.ini).
      #    No Spark session and no network: HTTP calls and sleeps are mocked.
      - name: Pytest
        run: pytest

      # 6) dbt needs a profile even to parse. parse never connects to Databricks,
      #    so dummy values are enough and no real secret is stored anywhere.
      #    Written here (not committed), because profiles.yml is git-ignored on purpose.
      - name: Create dbt CI profile
        run: |
          mkdir -p "$RUNNER_TEMP/dbt_profiles"
          cat > "$RUNNER_TEMP/dbt_profiles/profiles.yml" <<'EOF'
          olist_lakehouse:
            target: ci
            outputs:
              ci:
                type: databricks
                host: ci-dummy.cloud.databricks.com
                http_path: /sql/1.0/warehouses/ci-dummy
                token: ci-dummy-not-a-secret
                catalog: olist_dev
                schema: silver
                threads: 1
          EOF

      # 7) Install dbt packages (dbt_utils); dbt_packages/ is git-ignored
      - name: dbt deps
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: ${{ runner.temp }}/dbt_profiles
        run: dbt deps

      # 8) Validate the whole project; any warning (e.g. YAML not matching a model) fails CI
      - name: dbt parse (warnings as errors)
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: ${{ runner.temp }}/dbt_profiles
        run: dbt parse --no-partial-parse --warn-error

  dbt_build_pr:
    # Only for pull requests: the schema name needs the PR number
    if: github.event_name == 'pull_request'
    # Start only after the quick checks passed - saves Free Edition compute quota
    needs: checks
    runs-on: ubuntu-latest
    # The serverless warehouse can need 10+ minutes to start on Free Edition
    timeout-minutes: 45

    # Connection details, read by profiles.yml below via env_var().
    # DBT_ENV_SECRET_ prefix = dbt hides the value in its logs (GitHub masks it too).
    env:
      DBT_DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DBT_DATABRICKS_HTTP_PATH: ${{ vars.DATABRICKS_HTTP_PATH }}
      DBT_DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DBT_ENV_SECRET_DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      # Unique per run: a cancelled older run cleans up only its own schemas
      PR_SCHEMA: ci_pr${{ github.event.pull_request.number }}_run${{ github.run_number }}

    steps:
      # 1) Get the code of the pull request
      - name: Checkout
        uses: actions/checkout@v4

      # 2) Same Python as everywhere else (3.12), same pip cache as job "checks"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      # 3) Only runtime dependencies: dbt is all this job needs (no ruff, pytest, pyspark)
      - name: Install dependencies
        run: pip install -r requirements.txt

      # 4) Real connection profile, target "pr" -> generate_schema_name adds the prefix.
      #    Values come from environment variables, so no secret is ever written to a file.
      - name: Create dbt PR profile
        run: |
          mkdir -p "$RUNNER_TEMP/dbt_profiles"
          cat > "$RUNNER_TEMP/dbt_profiles/profiles.yml" <<'EOF'
          olist_lakehouse:
            target: pr
            outputs:
              pr:
                type: databricks
                host: "{{ env_var('DBT_DATABRICKS_HOST') | replace('https://', '') }}"
                http_path: "{{ env_var('DBT_DATABRICKS_HTTP_PATH') }}"
                auth_type: oauth
                client_id: "{{ env_var('DBT_DATABRICKS_CLIENT_ID') }}"
                client_secret: "{{ env_var('DBT_ENV_SECRET_DATABRICKS_CLIENT_SECRET') }}"
                catalog: olist_dev
                schema: "{{ env_var('PR_SCHEMA') }}"
                threads: 4