# Databricks Asset Bundle = the whole deployment described as code.
# One command (databricks bundle deploy) creates/updates the Job in a workspace,
# so the Job is versioned in Git instead of existing only as clicks in the UI.
bundle:
  name: olist_lakehouse

# Resource definitions live in separate files (one file per Job/pipeline)
include:
  - resources/*.yml

# Values that differ between environments; tasks reference them as ${var.<name>}
variables:
  catalog:
    description: Unity Catalog catalog = environment (olist_dev / olist_prod)
    default: olist_dev
  warehouse_id:
    description: SQL warehouse used by the dbt task
    # Lookup by name, so no environment-specific ID is hardcoded in the repo
    lookup:
      warehouse: "Serverless Starter Warehouse"
  alert_email:
    description: >
      Who gets an email when a run fails. Defaults to the deploying user (local dev deploys).
      CD overrides it from a GitHub secret (BUNDLE_VAR_alert_email), so no personal email
      is stored in this public repo.
    default: ${workspace.current_user.userName}

targets:
  # dev = your sandbox. Development mode prefixes the Job name with [dev <user>],
  # pauses any schedule and deploys into your personal folder, so experiments
  # never collide with production.
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-9e0404db-d23d.cloud.databricks.com
    variables:
      catalog: olist_dev

  # prod = the "real" deployment: schedule active, data in olist_prod.
  # Owned and run by the CI/CD service principal "olist-cicd" (Application ID below,
  # not a secret), deployed only by GitHub Actions after a merge to main.
  prod:
    mode: production
    workspace:
      host: https://dbc-9e0404db-d23d.cloud.databricks.com
      # Fixed path in the service principal's folder: whoever deploys, there is
      # exactly one prod copy, and no personal user owns production code.
      root_path: /Workspace/Users/2f828db8-ee32-47e4-b7cb-6211a30319ad/.bundle/${bundle.name}/${bundle.target}
    # The Job runs as the service principal, not as a person:
    # production keeps working if a person leaves or loses access.
    run_as:
      service_principal_name: 2f828db8-ee32-47e4-b7cb-6211a30319ad
    variables:
      catalog: olist_prod